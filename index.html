<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Finchcastle: The Quest for the 10 Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English&family=Comic+Neue:wght@700&family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0a10;--panel:#15121c;--gold:#e3b341;--gold-dim:#8f6d21;--ink:#efe6d2;--ink-dim:#a89f8c;--ember:#e8601c;--rule:#2a2434;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000;box-shadow:0 0 0 1px var(--rule),0 30px 80px rgba(0,0,0,.6)}
  canvas{display:block;width:100%;height:100%}
  #bloomov{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:screen;opacity:0}
  #modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,8,.82);backdrop-filter:blur(2px)}
  #modal.open{display:flex}
  .panel{position:relative;overflow:hidden;width:min(92%,640px);background:var(--panel);border:1px solid var(--gold-dim);padding:28px 32px 24px;box-shadow:0 0 0 6px #0b0a10,0 0 0 7px var(--gold-dim)}
  .panel h2{font-family:Cinzel,serif;font-weight:800;color:var(--gold);margin:0 0 6px;font-size:clamp(18px,2.6vw,28px);letter-spacing:.02em}
  .panel .who{color:var(--ink-dim);font-style:italic;margin:0 0 16px;font-size:clamp(13px,1.6vw,16px)}
  .panel p{font-size:clamp(15px,1.9vw,20px);line-height:1.5;margin:0 0 16px}
  .panel .riddle{border-left:3px solid var(--gold-dim);padding-left:14px;color:var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=text]{flex:1;min-width:160px;font:inherit;font-size:clamp(15px,1.9vw,19px);padding:10px 12px;background:#0b0a10;color:var(--ink);border:1px solid var(--rule);outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  button{font-family:Cinzel,serif;font-weight:600;font-size:clamp(13px,1.6vw,16px);padding:10px 18px;background:var(--gold);color:#1a1409;border:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .hint{margin-top:14px;padding:14px 16px;background:#0b0a10;border:1px dashed var(--gold-dim);color:var(--gold);font-size:clamp(15px,1.9vw,20px);display:none}
  .hint.show{display:block}
  .feedback{min-height:1.4em;color:var(--ember);font-style:italic;margin-top:8px}
  button.coin{width:52px;height:52px;border-radius:50%;padding:0;background:radial-gradient(circle at 35% 30%,#fff2b0,#e3b341 45%,#8f6d21 100%);box-shadow:0 0 0 3px #5a4414,0 0 0 5px #e3b341,0 4px 14px rgba(0,0,0,.6);color:#3a2a08;font-family:Cinzel,serif;font-weight:800;font-size:26px;line-height:52px;text-align:center;animation:spin 2.6s linear infinite;transform-style:preserve-3d}
  @keyframes spin{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
  button.coin.used{animation:none;filter:grayscale(1) brightness(.6);cursor:default}
  button.coin span{display:inline-block;text-shadow:0 1px 0 #fff2b0}
  button.skip{background:transparent;color:var(--ink-dim);border:1px solid var(--rule);font-size:13px}
  button.skip:hover{color:var(--ink);border-color:var(--gold-dim)}
  .sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .sparkles i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe08a;box-shadow:0 0 8px 2px rgba(255,210,120,.8);opacity:0;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%{opacity:0;transform:translateY(0) scale(.4)}30%{opacity:1;transform:translateY(-10px) scale(1)}70%{opacity:.8}100%{opacity:0;transform:translateY(-40px) scale(.3)}}
  #help{position:absolute;left:12px;bottom:10px;color:var(--ink-dim);font-size:12px;opacity:.75;pointer-events:none}
  #mute{position:absolute;right:12px;bottom:8px;background:transparent;color:var(--ink-dim);border:1px solid var(--rule);font-size:11px;padding:4px 8px}
  #touch{position:fixed;inset:0;z-index:50;pointer-events:none;display:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
    --r:max(14px,env(safe-area-inset-right));--b:max(12px,env(safe-area-inset-bottom));--J:min(26vh,150px);--B:min(16vh,92px);--P:calc(var(--B)*0.82);--D:calc((var(--J) + var(--B))/2 + 8px);
    --cx:calc(var(--D) + var(--B)/2 + var(--r) + 4px);--cy:calc(var(--b) + var(--J)/2)}
  body.touch #touch{display:block}
  body.touch #help,body.touch #mute{display:none}
  #t-zone{position:fixed;left:0;top:0;width:50vw;height:100%;pointer-events:none;touch-action:none}
  body.t-play #t-zone{pointer-events:auto}
  #touch .tb{position:absolute;pointer-events:none;touch-action:none;border-radius:50%;background:rgba(11,10,16,.55);border:3px solid var(--c);color:var(--c);box-shadow:0 0 14px var(--g),inset 0 0 12px var(--g);display:none;align-items:center;justify-content:center;padding:0;width:var(--s);height:var(--s);-webkit-tap-highlight-color:transparent}
  #touch .tb svg{width:58%;height:58%;pointer-events:none}
  #touch .tb.on{background:var(--c);color:#10101a}
  body.t-play #touch .act{display:flex;pointer-events:auto}
  body.t-play #touch .act.hide,body.t-play #touch .hide{display:none}
  #t-jump{--s:var(--J);--c:#5ee07a;--g:rgba(94,224,122,.35);right:calc(var(--cx) - var(--J)/2);bottom:var(--b)}
  #t-fire{--s:var(--B);--c:#ff8c3c;--g:rgba(255,140,60,.35);right:calc(var(--cx) - var(--B)/2);bottom:calc(var(--cy) + var(--D) - var(--B)/2)}
  #t-hit{--s:var(--B);--c:#ff4d4d;--g:rgba(255,77,77,.35);right:calc(var(--cx) + var(--D) - var(--B)/2);bottom:calc(var(--cy) - var(--B)/2)}
  #t-sun{--s:var(--B);--c:#ffd84a;--g:rgba(255,216,74,.35);right:calc(var(--cx) - var(--D) - var(--B)/2);bottom:calc(var(--cy) - var(--B)/2)}
  #t-push{--s:var(--P);--c:#8fcbff;--g:rgba(143,203,255,.3);right:calc(var(--cx) + var(--D)*0.7071 - var(--P)/2);bottom:calc(var(--cy) + var(--D)*0.7071 - var(--P)/2)}
  #t-ps{--s:40px;--c:#e3b341;--g:rgba(227,179,65,.2);left:calc(50% - 20px);top:max(8px,env(safe-area-inset-top))}
  body.t-play #t-ps{display:flex;pointer-events:auto}
  #t-ok,#t-es{--s:48px;--c:#e3b341;--g:rgba(227,179,65,.2)}
  #t-ok{left:calc(50% - 24px);bottom:max(10px,env(safe-area-inset-bottom))}
  #t-es{left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top))}
  body:not(.t-play):not(.t-pause) #t-ok,body:not(.t-play):not(.t-pause) #t-es{display:flex;pointer-events:auto}
  #tpause{position:fixed;inset:0;z-index:60;display:none;background:#060a08;color:#efe6d2;font-family:Cinzel,serif;overflow:auto;padding:max(10px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));box-sizing:border-box;-webkit-user-select:none;user-select:none}
  body.t-pause #tpause{display:flex;flex-direction:column;gap:8px;justify-content:center}
  #tpause .hd{display:flex;align-items:center;justify-content:space-between}
  #tpause .hd b{font-size:clamp(18px,4.4vh,26px);color:#e3b341;font-weight:800}
  #tpause .hd span{font-size:14px;color:#a89f8c;margin-left:8px;font-weight:600}
  #tpause .lb{font-size:11px;letter-spacing:.12em;color:#a89f8c;font-weight:800}
  #tpause .row{display:flex;gap:7px}
  #tpause button{font-family:Cinzel,serif;-webkit-tap-highlight-color:transparent;cursor:pointer}
  #tpause .chip{flex:1 1 0;min-width:0;height:clamp(40px,12vh,56px);padding:0;border-radius:12px;background:rgba(239,230,210,.06);border:2px solid rgba(255,255,255,.2);color:#d8ccb0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:clamp(8px,1.6vh,10px)}
  #tpause .chip.sel{background:rgba(227,179,65,.28);border-color:#ffe08a;color:#fff3d0}
  #tpause .chip svg{width:clamp(18px,5vh,26px);height:clamp(18px,5vh,26px)}
  #tpause .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:4px}
  #tpause .mb{height:clamp(40px,11vh,52px);padding:0 8px;border-radius:12px;background:rgba(239,230,210,.07);border:2px solid rgba(227,179,65,.55);color:#efe6d2;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:clamp(11px,2.2vh,14px)}
  #tpause .mb svg{width:clamp(18px,4.6vh,24px);height:clamp(18px,4.6vh,24px);flex:none}
  #tpause .mb.warn{border-color:#e8601c;color:#ffb089}
  #tpause .res{width:clamp(40px,10vh,48px);height:clamp(40px,10vh,48px);border-radius:50%;background:#e3b341;border:0;color:#1a1409;display:flex;align-items:center;justify-content:center;padding:0}
  #tpause .res svg{width:55%;height:55%}
  #rotate{position:fixed;inset:0;z-index:99;background:#0b0a10;color:#e3b341;display:none;align-items:center;justify-content:center;text-align:center;font:800 22px Cinzel,serif;padding:30px}
  @media (orientation:portrait){ body.touch #rotate{display:flex} }
  @media (prefers-reduced-motion:reduce){button.coin{animation:none}.sparkles i{animation:none;opacity:.6}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="540"></canvas>
  <canvas id="bloomov" width="192" height="108"></canvas>
  <div id="modal" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="sparkles" id="m-sparkles"></div>
      <h2 id="m-title">A Ring Is Earned</h2>
      <p class="who" id="m-who"></p>
      <p class="riddle" id="m-text"></p>
      <div class="row" id="m-answer-row">
        <input type="text" id="m-input" placeholder="Type your answer" autocomplete="off">
        <button id="m-submit">Answer</button>
      </div>
      <div class="feedback" id="m-feedback"></div>
      <div class="hint" id="m-hint"></div>
      <div class="row" style="margin-top:16px;justify-content:space-between;align-items:center">
        <button id="m-skip" class="coin" title="Hint coin" aria-label="Use a hint coin"><span>H</span></button>
        <span style="flex:1"></span>
        <button class="skip" id="m-skipriddle">Skip this riddle (-300)</button>
        <button id="m-continue" style="display:none">Continue the quest</button>
      </div>
    </div>
  </div>
  <div id="help">Arrows or WASD move. Up aims up. Down crouches. Space jumps. X or J melee. Z or K special. F story power. Enter talks. P pauses.</div>
  <button id="mute">Sound: on</button>
</div>

<script>
/* ================================================================
   CONFIG — Dad edits this block.
   ================================================================ */
const CONFIG = {
  heroName: "Zig",
  HINT_5:  "Look where you first hang your cloak when you come home. Behind what hides, the first gift waits.",
  HINT_10: "Seek the place that holds what keeps us warm in winter. The last gift rests beneath.",
  riddles: [
    { who:"Solomon's Root", q:"I have rings but no fingers. I grow taller every year and remember every summer. What am I?", a:["tree","oak","trees"], hint:"Solomon is one of these." },
    { who:"The Hooded Lamplighter", q:"I'm full of light but I'm not the sun. I hang in the dark until the morning comes.", a:["lantern","lamp","light","lanterns"], hint:"He carries one on his pole." },
    { who:"The Ferryman", q:"Elf math. A river dragon lays 24 eggs and hides them equally in 4 caves. A serpent raids one cave and eats 3 eggs. How many eggs are left in that cave?", a:["3","three"], hint:"Divide the eggs by the caves first. Then take away what was eaten.", math:true },
    { who:"The Frost Hermit", q:"I fall but never get hurt. I cover the ground but I'm not a blanket. I vanish when the sun returns.", a:["snow","snowflake","snowflakes","snowfall"], hint:"It is white, it is cold, and it is falling all around you right now." },
    { who:"The Gaunt's Last Breath", q:"I have a face and two hands but no arms or legs. What am I?", a:["clock","watch","clocks"], hint:"It hangs on a wall and tells you something.", gift:true },
    { who:"The Rune Stone", q:"I'm tallest when I'm young and shortest when I'm old. What am I?", a:["candle","candles"], hint:"It melts as it burns." },
    { who:"The Stone Giant", q:"Elf math. Three dragon brothers each guard 15 gold coins. A thief steals 9 coins from the pile. How many coins are left?", a:["36","thirty six","thirty-six"], hint:"Add up what the three brothers guard. Then subtract the stolen coins.", math:true },
    { who:"The Ancient Owl", q:"The more of me you take, the more you leave behind. What am I?", a:["footsteps","steps","footprints","tracks","foot prints","foot steps","prints","footstep","footprint","track"], hint:"Look down at the snow or the mud after you walk." },
    { who:"The Blind Oracle", q:"Elf math. A sky dragon flies 8 miles every hour. She flies for 7 hours, then rests and flies 4 more miles. How far did she fly?", a:["60","sixty"], hint:"Eight miles times seven hours. Then add the last four.", math:true },
    { who:"The Titan's Ashes", q:"I can travel around the whole world while staying in one corner. What am I?", a:["stamp","postage","stamps"], hint:"It goes on the corner of an envelope.", gift:true },
  ],
  points: { piranha:120, jelly:200, wisp:100, stick:250, fish:100, shark:400, toad:150, skull:200, imp:250, eel:200, serpent:200, ember:50, ring:1000, nohit:500 },
};

/* ================================================================
   AUDIO
   ================================================================ */
let AC=null, master=null, outNode=null, musicBus=null, gtrBus=null, musicOn=true, musicTimer=null;
function audioInit(){ if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.6; const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.18; master.connect(comp); comp.connect(AC.destination); outNode=comp;
  musicBus=AC.createGain(); musicBus.gain.value=0.9; musicBus.connect(master);
  // electric guitar chain: highpass -> hard clipping -> cabinet lowpass
  gtrBus=AC.createGain(); const ws=AC.createWaveShaper(), cv2=new Float32Array(2048); for(let i=0;i<2048;i++){ const x=i/1024-1; cv2[i]=Math.tanh(x*5); } ws.curve=cv2; ws.oversample='4x';
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=60; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3400; lp.Q.value=0.8; const out=AC.createGain(); out.gain.value=0.5;
  gtrBus.connect(hp); hp.connect(ws); ws.connect(lp); lp.connect(out); out.connect(musicBus);
  startMusic(); }
function tone(freq,type,dur,vol,when,slideTo,dest){ if(!AC||!musicOn||!isFinite(freq)||freq<=0) return; const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(freq,when); if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,when+dur); g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(vol,when+0.015); g.gain.exponentialRampToValueAtTime(0.0001,when+dur); o.connect(g); g.connect(dest||master); o.start(when); o.stop(when+dur+0.05); }
function noise(dur,vol,when,hp,lp,dest){ if(!AC||!musicOn) return; const len=AC.sampleRate*dur,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); const s=AC.createBufferSource(); s.buffer=buf; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(lp||4000,when); f.frequency.exponentialRampToValueAtTime(hp||200,when+dur); const g=AC.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.0001,when+dur); s.connect(f); f.connect(g); g.connect(dest||master); s.start(when); }
function kick(when,dest){ if(!AC||!musicOn) return; const o=AC.createOscillator(),g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(150,when); o.frequency.exponentialRampToValueAtTime(40,when+0.14); g.gain.setValueAtTime(0.5,when); g.gain.exponentialRampToValueAtTime(0.001,when+0.2); o.connect(g); g.connect(dest||master); o.start(when); o.stop(when+0.22); }
function snare(when,dest){ noise(0.16,0.35,when,800,6000,dest); tone(190,'triangle',0.08,0.12,when,120,dest); }
function hat(when,vol,dest){ if(!AC||!musicOn) return; const len=AC.sampleRate*0.04,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len); const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000; const g=AC.createGain(); g.gain.value=vol*0.25; src.connect(f); f.connect(g); g.connect(dest||master); src.start(when); }
const SFX={
  jump(){ if(!AC)return; const n=AC.currentTime; tone(300,'sine',0.18,0.25,n,620); },
  hammer(){ if(!AC)return; const n=AC.currentTime; noise(0.34,0.5,n,100,1800); tone(140,'sawtooth',0.3,0.1,n,60); tone(70,'sine',0.35,0.45,n+0.13,32); noise(0.25,0.45,n+0.13,80,1200); [0,1,2].forEach(i=>noise(0.04,0.2,n+0.17+i*0.05,1500,6000)); },
  whip(){ if(!AC)return; const n=AC.currentTime; noise(0.08,0.2,n,1200,6000); tone(500,'sine',0.08,0.06,n,2200); noise(0.05,0.9,n+0.07,2500,9000); tone(2400,'square',0.04,0.16,n+0.07,500); tone(1200,'triangle',0.1,0.1,n+0.075,300); },
  lightning(){ if(!AC)return; const n=AC.currentTime; noise(0.3,0.6,n,900,9000); tone(1900,'sawtooth',0.16,0.14,n,260); for(let i=0;i<6;i++) noise(0.025,0.4,n+0.03+i*0.035+Math.random()*0.02,2000,9000); tone(55,'sine',0.7,0.35,n+0.06,30); noise(0.5,0.3,n+0.08,60,700); },
  cupcake(){ if(!AC)return; const n=AC.currentTime; tone(420,'sine',0.12,0.22,n,900); tone(880,'triangle',0.1,0.12,n+0.07,1300); tone(1320,'sine',0.08,0.08,n+0.12); },
  swing(){ if(!AC)return; const n=AC.currentTime; noise(0.26,0.45,n,200,2600); tone(180,'sine',0.2,0.08,n,60); },
  fireball(){ if(!AC)return; const n=AC.currentTime; /* ignition pop, rushing whoosh, low rumble, crackle */ noise(0.06,0.6,n,2000,8000); noise(0.45,0.55,n+0.02,120,1800); tone(220,'sawtooth',0.4,0.12,n,55); tone(90,'sine',0.5,0.25,n,40); for(let i=0;i<5;i++) noise(0.03,0.25,n+0.08+i*0.06+Math.random()*0.03,1500,6000); },
  screech(){ if(!AC)return; const n=AC.currentTime; /* roar: low growl, rising sawtooth throat, gravel noise */ tone(70,'sawtooth',0.9,0.22,n,120); tone(95,'square',0.8,0.10,n+0.05,160); noise(0.9,0.4,n,150,900); tone(45,'sine',1.0,0.35,n,30); for(let i=0;i<6;i++) noise(0.05,0.2,n+0.1+i*0.1,300,2000); },
  hit(){ if(!AC)return; const n=AC.currentTime; tone(200,'sawtooth',0.3,0.3,n,60); noise(0.15,0.3,n,100,1200); },
  kill(){ if(!AC)return; const n=AC.currentTime; noise(0.18,0.35,n,150,2500); tone(700,'square',0.08,0.12,n,200); },
  ember(){ if(!AC)return; const n=AC.currentTime; tone(1046,'sine',0.1,0.18,n); tone(1568,'sine',0.14,0.14,n+0.07); },
  ring(){ if(!AC)return; const n=AC.currentTime; [523,659,784,1046,1318].forEach((f,i)=>tone(f,'triangle',0.5,0.2,n+i*0.09)); },
  talk(){ if(!AC)return; const n=AC.currentTime; tone(440,'triangle',0.08,0.1,n); },
  wrong(){ if(!AC)return; const n=AC.currentTime; tone(180,'square',0.2,0.12,n,140); },
  crack(){ if(!AC)return; const n=AC.currentTime; noise(0.2,0.4,n,200,3000); },
  bossdie(){ if(!AC)return; const n=AC.currentTime; noise(1.2,0.6,n,60,2000); [262,330,392,523].forEach((f,i)=>tone(f,'triangle',0.8,0.2,n+0.3+i*0.12)); },
};

function buildLevel(n){

    platforms.push({x:0,y:groundY-14,w:220,h:30,ground:true,rock:true});
    let x=260; let i=0;
    while(x<L.len-420){ const bw=110+Math.floor(r()*50); const span=70+Math.floor(r()*70); platforms.push({x:x,y:groundY-12,w:bw,h:18,boat:true,x0:x-30,x1:x+span,dir:i%2?-1:1,speed:0.5+r()*0.3,bob:r()*6}); x+=bw+span+50; i++;
      if(r()<0.35){ platforms.push({x:x-20,y:groundY-16,w:70,h:30,ground:true,rock:true}); x+=70; } }
    platforms.push({x:L.len-400,y:groundY-14,w:800,h:30,ground:true,rock:true});
  } else {
    let x=0;
    while(x<L.len){ const seg=280+Math.floor(r()*380); platforms.push({x,y:groundY,w:seg,h:120,ground:true}); x+=seg;
      if(!B.swim&&!L.noGaps&&x<L.len-500&&r()<0.6){ const gap=110+Math.floor(r()*90); const bw=Math.max(64,Math.floor(gap*0.6)); platforms.push({x:x+4,y:groundY+2,w:bw,h:16,bridge:true,x0:x-20,x1:x+gap+20-bw,dir:1,speed:0.55+r()*0.25,bob:r()*6}); x+=gap; } }
    platforms.push({x:L.len-60,y:groundY,w:400,h:120,ground:true});
    const tall=L.biome==='crags';
    for(let i=0;i<Math.floor(L.len/230);i++){ const px=300+i*230+r()*120, py=groundY-90-Math.floor(r()*(tall?4:3))*65, pw=100+r()*80;
      if(px<L.len-520){ const pl={x:px,y:py,w:pw,h:20,baseY:py}; if(B.movers&&r()<0.5){ pl.mover=true; pl.x0=px-60; pl.x1=px+60; pl.dir=1; pl.speed=0.6+r()*0.4; } if(B.crumble&&r()<0.6) pl.crumble=0; if(B.sink&&r()<0.6) pl.sink=true; platforms.push(pl); if(r()<0.7) for(let k=0;k<3;k++) embers.push({x:px+20+k*28,y:py-34,got:false,t:k}); } }
    if(B.ice){ for(const s of platforms) if(s.ground&&r()<0.7) s.ice=true; for(let i=0;i<Math.floor(L.len/260);i++){ const ix=400+i*260+r()*120; if(ix<L.len-500) hazards.push({type:'icicle',x:ix,y:60+r()*60,vy:0,fall:false,tm:0}); } }
    if(B.geysers){ for(let i=0;i<Math.floor(L.len/330);i++){ const gx=420+i*330+r()*100; if(gx<L.len-520) hazards.push({type:'geyser',x:gx,tm:Math.floor(r()*200),on:false}); } }
    if(L.holes){ const count=2+Math.floor(r()*2); for(let i=0;i<count;i++){ for(let k=0;k<12;k++){ const hx=500+i*((L.len-1100)/count)+r()*260; const seg=platforms.find(q=>q.ground&&!q.bridge&&hx>q.x+70&&hx+52<q.x+q.w-70); if(seg){ holes.push({x:hx,w:52,state:'idle',tm:0,cool:0}); break; } } } }
  }
  for(let i=0;i<Math.floor(L.len/400);i++){ const ex=250+i*400+r()*200; if(ex<L.len-500) embers.push({x:ex,y:groundY-100-r()*60,got:false,t:i}); }
  for(const [type,ex] of L.enemies) enemies.push(makeEnemy(type,ex,r));

  const zone=$('t-zone'); let zp=null, ox=0, oy=0; const DIRS=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];

  zone.addEventListener('pointerdown',e=>{ if(zp!==null) return; e.preventDefault(); zp=e.pointerId; try{ zone.setPointerCapture(zp); }catch(_){} ox=e.clientX; oy=e.clientY; audioInit(); });
  zone.addEventListener('pointermove',e=>{ if(e.pointerId!==zp) return; let dx=e.clientX-ox, dy=e.clientY-oy; const F=56;
    if(Math.abs(dx)>F){ ox=e.clientX-Math.sign(dx)*F; dx=Math.sign(dx)*F; } if(Math.abs(dy)>F){ oy=e.clientY-Math.sign(dy)*F; dy=Math.sign(dy)*F; }
    const th=14, want={ArrowLeft:dx<-th,ArrowRight:dx>th,ArrowUp:dy<-th*1.7,ArrowDown:dy>th*1.7}; for(const k of DIRS){ if(want[k]) press(k); else rel(k); } });
  const zend=e=>{ if(e.pointerId!==zp) return; zp=null; relDirs(); };
  zone.addEventListener('pointerup',zend); zone.addEventListener('pointercancel',zend); zone.addEventListener('lostpointercapture',e=>{ if(zp!==null&&e.pointerId===zp){ zp=null; relDirs(); } });
  document.addEventListener('touchmove',e=>{ if(!e.target.closest('#tpause')) e.preventDefault(); },{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  try{ setRes(2); }catch(e){}
  // pause menu (DOM, tap only)
  const W_=[['sword','Sword'],['hammer','Hammer'],['dual','Kukri'],['whip','Whip'],['hatchet','Hatchets'],['book','Spellbook'],['rattle','Rattle']];
  const S_=[['fire','Fireball'],['lightning','Lightning'],['cupcake','Cupcake'],['smash','Smash'],['boomerang','Boomerang'],['tome','Tome'],['bubble','Bubbles']];
  const tp=$('tpause'); let sig='';
  function pauseSig(){ return [heroKey,MEL(),RNG(),ZR[heroKey],confirmNew>0,gameMode==='birthday',document.getElementById('mute').textContent].join('|'); }
  function renderPause(){ sig=pauseSig(); const hn=CHARS[heroKey].name, baby=!!CHARS[heroKey].baby, zon=zozoOn(heroKey);
    const chips=(L,row,cur)=>L.map(x=>'<button class="chip'+(x[0]===cur?' sel':'')+'" data-row="'+row+'" data-id="'+x[0]+'" aria-label="'+x[1]+'">'+svg(x[0])+'<span>'+x[1]+'</span></button>').join('');
    const mb=(id,k,label,cls)=>'<button class="mb'+(cls?' '+cls:'')+'" data-a="'+id+'">'+svg(k)+'<span>'+label+'</span></button>';
    let items=[mb('restart','restart','Restart'),mb('armory','armory','Armory'),mb('hero','hero','Hero: '+hn)];
    if(gameMode!=='birthday') items.push(mb('map','map','Map')); items.push(mb('title','title','Title'),mb('sound','sound',document.getElementById('mute').textContent.replace('Sound: ','Sound ')));
    if(!baby) items.push(mb('zozo','zozo','Zozo '+(zon?'on':'off')));
    items.push(mb('newgame','newgame',confirmNew>0?'Tap to erase all':'New game','warn'));
    tp.innerHTML='<div class="hd"><div><b>Paused</b><span>'+hn+'</span></div><button class="res" data-a="resume" aria-label="Resume">'+svg('resume')+'</button></div>'+
      '<div class="lb">WEAPON</div><div class="row">'+chips(W_,0,MEL())+'</div><div class="lb">SPECIAL</div><div class="row">'+chips(S_,1,RNG())+'</div><div class="grid">'+items.join('')+'</div>'; }
  tp.addEventListener('click',e=>{ const c=e.target.closest('.chip'), m=e.target.closest('[data-a]'); audioInit();
    if(c){ setLO(+c.dataset.row,c.dataset.id); renderPause(); return; }
    if(!m) return; const a=m.dataset.a;
    if(a==='resume'){ paused=false; SFX.talk(); }
    else if(a==='restart'){ restartLevel(); }
    else if(a==='armory'){ shopBack='pause'; shopHero=heroKey; shopSel=0; state='shop'; }
    else if(a==='hero'){ const ks=HEROES; heroKey=ks[(ks.indexOf(heroKey)+1)%ks.length]; save(); refitPlayer(); SFX.ring(); }
    else if(a==='map'){ paused=false; state=(gameMode==='camp'?'camp':'map'); player=null; }
    else if(a==='title'){ paused=false; state='title'; player=null; }
    else if(a==='sound'){ document.getElementById('mute').click(); }
    else if(a==='zozo'){ toggleZozo(); }
    else if(a==='newgame'){ if(confirmNew>0) newGame(); else { confirmNew=180; SFX.wrong(); } }
    renderPause(); });
  // keep overlay state in step with the game
  let lastIcons='';
  setInterval(()=>{ try{
    const playing=(state==='play')&&!paused&&!mathCard&&!modalOpen, pz=(state==='play')&&paused&&!modalOpen;
    const was=document.body.classList.contains('t-play');
    document.body.classList.toggle('t-play',playing); document.body.classList.toggle('t-pause',pz);
    if(was&&!playing){ relDirs(); for(const k of ['Space','KeyZ','KeyX','KeyF','KeyV']) rel(k); document.querySelectorAll('#touch .tb.on').forEach(b=>b.classList.remove('on')); zp=null; }
    const ic=MEL()+'|'+RNG(); if(ic!==lastIcons){ lastIcons=ic; $('t-hit').innerHTML=svg(MEL()); $('t-fire').innerHTML=svg(RNG()); }
    $('t-push').classList.toggle('hide',!gHas('bp')); $('t-sun').classList.toggle('hide',!(gameMode==='camp'&&cm&&cm.mech));
    if(pz&&(sig!==pauseSig()||!tp.firstChild)) renderPause();
  }catch(_){} },120);
  try{ const c=document.createElement('canvas'); c.width=c.height=180; const x=c.getContext('2d'); x.fillStyle='#0b0a10'; x.fillRect(0,0,180,180); x.strokeStyle='#e3b341'; x.lineWidth=14; x.beginPath(); x.arc(90,90,52,0,7); x.stroke(); x.fillStyle='#e3b341'; x.beginPath(); x.arc(90,38,14,0,7); x.fill(); const l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=c.toDataURL('image/png'); document.head.appendChild(l); }catch(e){}
})();
</script>
